services:
  web:
    build: .
    container_name: mening_hamyonim_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - SECRET_KEY=django-insecure-prod-secret-change-this-in-env
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./static:/app/static
