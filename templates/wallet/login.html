{% extends 'wallet/base.html' %}

{% block title %}Tizimga kirish{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card p-4 p-md-5 border-0 shadow-sm">
            <div class="text-center mb-4">
                <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
                    <i class="bi bi-wallet2 fs-2"></i>
                </div>
                <h3 class="fw-bold text-dark">Tizimga kirish</h3>
                <p class="text-muted small">“Mening hamyonim” shaxsiy moliyaviy hisobingizga kiring</p>
            </div>

            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label fw-semibold">Login</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" autofocus required class="form-control" id="id_username" placeholder="Loginni kiriting">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="id_password" class="form-label fw-semibold">Parol</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" required class="form-control" id="id_password" placeholder="Parolni kiriting">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold btn-rounded shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Kirish
                </button>
            </form>

            <div class="mt-4 text-center">
                <p class="text-muted small mb-0">
                    Profilingiz yo'qmi? 
                    <a href="{% url 'register' %}" class="text-primary fw-semibold text-decoration-none">Ro'yxatdan o'tish</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
